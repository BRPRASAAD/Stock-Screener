name: NSE Bullish Near ATH Breakout Daily Scan

on:
  schedule:
    # Every day at 20:15 IST = 14:45 UTC (cron is always UTC)
    - cron: "45 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bullish near ATH breakout scan
        run: |
          mkdir -p results/daily
          python strategies/nse_bullish_near_ath_breakout_daily_scan.py --output results/daily/nse_bullish_near_ath_breakout_results_$(date -u +'%d_%B%Y_%H%M%S').csv

      - name: Commit results CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/daily/nse_bullish_near_ath_breakout_results_*.csv
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Bullish near ATH breakout scan results $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v5
        with:
          name: bullish-near-ath-breakout-results
          path: results/daily/nse_bullish_near_ath_breakout_results_*.csv
          retention-days: 30
