name: NSE Weekly Screener

on:
  schedule:
    # Every Friday at 20:15 IST = 14:45 UTC (cron is always UTC, 5 = Friday)
    - cron: "45 14 * * 5"
  workflow_dispatch: {}   # allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: write          # needed to commit the results CSV back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python nse_weekly_screener.py

      - name: Commit results CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/nse_screen_results_*.csv
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Rebase onto any commits pushed while this job was running.
            git pull --rebase origin main
            git push
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v5
        with:
          name: screen-results
          path: results/nse_screen_results_*.csv
          retention-days: 30
