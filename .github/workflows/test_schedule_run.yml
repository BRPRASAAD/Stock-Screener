name: Test Schedule Run

on:
  schedule:
    # Every 2 minutes for testing automatic execution
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-run:
    runs-on: ubuntu-latest

    steps:
      - name: Print current time
        run: |
          echo "Workflow triggered at $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "This is a test workflow to confirm scheduled execution is working."
