name: NSE Weekly Price Turnaround Scan

on:
  schedule:
    # Every Friday at ~16:03 IST = 10:33 UTC (cron is always UTC, 5 = Friday)
    - cron: "33 10 * * 5"
  workflow_dispatch: {}   # allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: write          # needed to commit the results CSV back to the repo

concurrency:
  group: stock-screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly price turnaround screener
        run: |
          mkdir -p results/weekly
          python strategies/nse_weekly_price_turnaround_scan.py --output results/weekly/nse_weekly_price_turnaround_results_$(date -u +'%d_%B%Y_%H%M%S').csv

      - name: Commit results CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/weekly/nse_weekly_price_turnaround_results_*.csv
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Weekly screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v5
        with:
          name: weekly-screen-results
          path: results/weekly/nse_weekly_price_turnaround_results_*.csv
          retention-days: 30
