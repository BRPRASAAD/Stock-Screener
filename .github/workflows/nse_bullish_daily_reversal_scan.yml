name: NSE Bullish Daily Reversal Scan

on:
  schedule:
    # Every day at ~16:03 IST = 10:33 UTC (cron is always UTC)
    - cron: "33 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bullish daily reversal scan
        run: |
          mkdir -p results/daily/reversal
          python strategies/nse_bullish_daily_reversal_scan.py --output results/daily/reversal/$(date -u +'%d_%B%Y_%H%M%S')_nse_bullish_daily_reversal_results.csv

      - name: Commit results CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/daily/reversal/*_nse_bullish_daily_reversal_results.csv
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Bullish daily scan results $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v5
        with:
          name: bullish-daily-results
          path: results/daily/reversal/*_nse_bullish_daily_reversal_results.csv
          retention-days: 30
