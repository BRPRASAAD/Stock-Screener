name: NSE Bullish Near ATH Breakout Weekly Scan

on:
  schedule:
    # Every Friday at ~16:03 IST = 10:33 UTC (cron is always UTC, 5 = Friday)
    - cron: "33 10 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly near ATH breakout screen
        run: |
          mkdir -p results/weekly/ath_breakout
          python strategies/nse_bullish_near_ath_breakout_weekly_scan.py --output results/weekly/ath_breakout/$(date -u +'%d_%B%Y_%H%M%S')_nse_bullish_near_ath_breakout_weekly_results.csv

      - name: Commit results CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/weekly/ath_breakout/*_nse_bullish_near_ath_breakout_weekly_results.csv
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Bullish near ATH breakout weekly results $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v5
        with:
          name: bullish-near-ath-breakout-weekly-results
          path: results/weekly/ath_breakout/*_nse_bullish_near_ath_breakout_weekly_results.csv
          retention-days: 30
